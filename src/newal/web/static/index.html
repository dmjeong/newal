<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>newal</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <h1>newal</h1>
      <span id="version"></span>
    </header>

    <nav class="modes">
      <a href="/" class="current">일반 사용</a>
      <a href="/training">학습</a>
    </nav>

    <section>
      <h2>워크스페이스</h2>
      <p id="workspace" class="mono wrap">…</p>
    </section>

    <section>
      <h2>모델 풀</h2>
      <ul id="models" class="mono"></ul>
      <p id="model-warning" class="hint bad-note" hidden></p>
    </section>

    <section>
      <h2>라우팅</h2>
      <p id="routing" class="mono"></p>
    </section>

    <section>
      <h2>토큰 사용량</h2>
      <table id="usage"><tbody></tbody></table>
    </section>

    <section>
      <h2>수집된 학습 데이터</h2>
      <table id="captured"><tbody></tbody></table>
    </section>

    <footer>
      <button id="open-settings" type="button">설정</button>
      <button id="reset" type="button">대화 초기화</button>
      <p id="shell-policy" class="hint"></p>
    </footer>
  </aside>

  <main>
    <div id="messages" aria-live="polite"></div>

    <div id="composer">
      <div id="attachments" hidden></div>
      <div id="drop-hint" hidden>여기에 이미지나 동영상을 놓으세요</div>
      <form id="form">
        <textarea id="input" rows="1" placeholder="무엇을 도와드릴까요?  (Shift+Enter 줄바꿈, 파일은 드래그앤드롭)" autofocus></textarea>
        <div class="controls">
          <label class="file-button">
            첨부
            <input type="file" id="file" accept="image/*,video/*" multiple hidden>
          </label>
          <button id="send" type="submit">보내기</button>
        </div>
      </form>
    </div>
  </main>
</div>

<dialog id="settings">
  <h3>설정</h3>
  <p class="hint">
    바꾸면 바로 적용되고 <code>configs/local.yaml</code>에 저장됩니다.
    모델 풀과 포트는 시작할 때 읽으므로 여기서는 바꿀 수 없습니다.
  </p>
  <div id="settings-body"></div>
  <p id="settings-status" class="hint"></p>
  <menu>
    <button id="settings-close" type="button" class="secondary">닫기</button>
    <button id="settings-save" type="button">저장</button>
  </menu>
</dialog>

<dialog id="approval">
  <h3>셸 명령 실행 요청</h3>
  <pre id="approval-detail" class="mono"></pre>
  <p class="hint">이 명령은 워크스페이스 안에서 실행됩니다.</p>
  <menu>
    <button id="deny" type="button" class="secondary">거부</button>
    <button id="allow" type="button">허용</button>
  </menu>
</dialog>

<script src="/static/labels.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
