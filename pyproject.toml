[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newal"
version = "2.1.1"
description = "Local multimodal coding assistant powered by a pool of Qwen models (text + image + video)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "pillow>=10.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Video keyframe extraction. Without this, only images and text work.
video = ["opencv-python-headless>=4.9"]
# Dense retrieval on top of the built-in BM25. Optional: BM25 alone works fine.
dense = ["sentence-transformers>=3.0"]
# In-process inference without a separate server (slow, but no vLLM needed).
transformers = ["transformers>=4.57", "torch>=2.4", "accelerate>=0.33"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[project.scripts]
newal = "newal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = [
    # Long lines are reported by E501 only above line-length; the codebase
    # deliberately keeps prose comments readable rather than reflowed.
    "E203",
]

[tool.ruff.lint.per-file-ignores]
# typer.Option() in a default is the documented Typer idiom, not a mutable
# default-argument bug.
"src/newal/cli.py" = ["B008"]
# Tests use fixtures and stand-ins where a few of these rules fight clarity.
"tests/*" = ["B011", "SIM117"]
