# newal default configuration.
# Copy to configs/local.yaml to override without touching version control,
# or point at any file with:  newal --config path/to/file.yaml

# ---------------------------------------------------------------------------
# Model pool
#
# Members are specialists doing DIFFERENT jobs, not the same model at several
# sizes. Ensembling same-family models ("Self-MoA") produces highly correlated
# errors and buys very little -- see arXiv:2606.27288. What pays off here is
# a cascade (cheap by default, escalate on real failure) plus dedicated
# retrieval models, which fail independently because their task is different.
#
# Only `heavy` is enabled by default so a single-GPU machine works out of the
# box. Turn the others on as VRAM allows -- each is a separate server process.
# ---------------------------------------------------------------------------
models:
  heavy:
    # Qwen3.6-35B-A3B: 35B total / 3B active MoE, natively multimodal
    # (text + image + video), 256K context, tuned for agentic coding.
    id: "Qwen/Qwen3.6-35B-A3B"
    base_url: "http://127.0.0.1:8000/v1"
    task: "generate"
    tier: 3
    enabled: true
    # Speculative decoding: a small draft model proposes tokens the big model
    # verifies in one pass. Output is distribution-identical, so this is pure
    # speedup. Set to null if VRAM is tight.
    speculative_draft: "Qwen/Qwen3.5-0.8B"
    speculative_tokens: 3

  light:
    # Handles mechanical work: renames, formatting, single-line edits, summaries.
    # Needs its own GPU slot -- enable once `heavy` fits comfortably.
    id: "Qwen/Qwen3.5-4B"
    base_url: "http://127.0.0.1:8001/v1"
    task: "generate"
    tier: 1
    enabled: false
    max_model_len: 32768

  embedding:
    # Dense retrieval. Genuinely different task from generation, so its errors
    # are uncorrelated with the coder's -- this is where a second model
    # actually earns its VRAM.
    id: "Qwen/Qwen3-Embedding-0.6B"
    base_url: "http://127.0.0.1:8002/v1"
    task: "embed"
    tier: 0
    enabled: false
    max_model_len: 8192

  reranker:
    # Cross-encoder rerank over merged BM25 + dense candidates.
    id: "Qwen/Qwen3-Reranker-0.6B"
    base_url: "http://127.0.0.1:8003/v1"
    task: "rerank"
    tier: 0
    enabled: false
    max_model_len: 8192

# Sampling defaults shared by every generation model.
generation:
  context_length: 262144
  temperature: 0.7
  top_p: 0.95
  max_output_tokens: 32768

# ---------------------------------------------------------------------------
# Routing: which model, and how hard it should think, decided per call.
# ---------------------------------------------------------------------------
router:
  # cascade -> route by difficulty and escalate on failure
  # single  -> always use the strongest model (what v0.1 did)
  strategy: "cascade"

  # How the tier is chosen. A heuristic decides on its own unless the score
  # lands near the threshold; only those borderline queries pay for a real
  # classifier, so obvious work stays free.
  #   heuristic -> patterns and signals only (free, deterministic, v1.0)
  #   semantic  -> nearest labelled exemplars via embeddings (~20ms)
  #   llm       -> ask the cheapest model (one short call)
  #   auto      -> heuristic, then semantic, then llm while still unsure
  mode: "auto"
  # Difficulty score at or above which a call goes straight to the top tier.
  escalate_threshold: 0.45
  # Half-width of the band around the threshold where a classifier is consulted.
  # 0 disables classifiers entirely, whatever `mode` says.
  uncertainty_band: 0.12
  # Verdicts below this confidence are ignored and the heuristic stands.
  min_classifier_confidence: 0.3
  semantic_neighbours: 5

  # Record what actually happened (did it escalate? did tests pass?) and reuse
  # it as training data. This is the part a hosted router cannot do: the labels
  # come from execution on YOUR repository.
  learn_from_outcomes: true
  max_learned_exemplars: 200

  # Escalation rounds allowed per step after a tool or verification failure.
  max_escalations: 2
  thinking:
    # adaptive -> decide per call from the difficulty score (recommended)
    # always / never -> force it
    mode: "adaptive"
    threshold: 0.55
  # Print the routing decision and its reasons for every call.
  explain: false

# Serving defaults. Any model may override these individually.
runtime:
  kind: "openai_compat"    # openai_compat | transformers
  engine: "vllm"           # vllm | sglang
  autostart: true
  request_timeout_s: 600
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
  # Serving 256K context costs a lot of KV cache. Lower this if you OOM.
  max_model_len: 65536
  quantization: null       # null | "fp8" | "awq" | "gptq"
  startup_timeout_s: 900
  extra_args: []

media:
  # Total visual tokens allowed per turn. Images and video frames share
  # this budget; the sampler downscales/drops frames to stay under it.
  visual_token_budget: 16384
  image_max_pixels: 1638400      # ~1280x1280, before the model's own resize
  video:
    max_frames: 32
    # uniform    -> evenly spaced frames
    # scene      -> frames at detected scene changes, padded uniformly
    strategy: "scene"
    scene_threshold: 0.28        # 0..1 histogram distance; lower = more cuts
    frame_max_pixels: 409600     # ~640x640 per frame
    include_timestamps: true

agent:
  max_steps: 40
  # Draft a plan before touching anything. Costs one extra call, reliably
  # improves multi-file edits.
  plan_first: true
  # After edits, re-read the diff and run the verify command. Execution is the
  # only signal in this system uncorrelated with model error, which makes it
  # the single biggest quality lever available.
  verify: true
  verify_command: null           # e.g. "python -m pytest -q"; null = auto-detect
  max_verify_retries: 2

tools:
  workspace_root: "."
  # ask | allow | deny -- applies to run_shell and run_python
  shell_policy: "ask"
  shell_timeout_s: 180
  max_file_read_bytes: 262144
  # Never readable/writable by tools regardless of policy.
  denied_paths: [".git", ".env", ".venv", "node_modules", "__pycache__"]

memory:
  enabled: true
  db_path: ".newal/memory.db"
  # File globs pulled into the retrieval index.
  index_globs: ["**/*.py", "**/*.md", "**/*.toml", "**/*.yaml", "**/*.yml"]
  index_exclude: [".venv/**", "node_modules/**", ".git/**", ".newal/**"]
  chunk_lines: 80
  chunk_overlap_lines: 15
  retrieve_top_k: 8
  # Blend dense similarity with BM25. Ignored unless an `embed` model is
  # enabled; BM25 alone still works.
  hybrid_retrieval: true
  dense_weight: 0.5
  # Cross-encoder rerank. Ignored unless a `rerank` model is enabled.
  use_reranker: true
  rerank_candidates: 30

ui:
  show_thinking: false
  show_token_usage: true
  # One JSONL file per session, one object per turn. Images and video frames
  # are redacted before writing; code discussed in the turn is not, so treat
  # this directory as sensitive.
  save_transcripts: true
  transcript_dir: ".newal/transcripts"
